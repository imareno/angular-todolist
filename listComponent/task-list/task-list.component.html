<div class="container">
  <mat-card appearance="outlined" class="card-layout">
    <mat-card-header>
      <mat-card-title> Práctica 1 Todo List</mat-card-title>
      <mat-card-subtitle>Una aplicación para gestionar tareas (To-Do List) con funcionalidades como agregar, editar, eliminar y marcar tareas como completadas.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
    
        <div *ngIf="selectedIndex >= 0" ng class="warning-container">
          <p>Registro en edición...</p>
        </div>
              
      <div>
        <mat-form-field appearance="outline">
          <mat-label>Agregar Tarea</mat-label>
          
          <input matInput placeholder="Describe que hacer" [(ngModel)]="description">
         
          <mat-icon *ngIf="selectedIndex >= 0"  matSuffix (click)="updateItem()">save_as</mat-icon>
          <mat-icon *ngIf="selectedIndex < 0"  matSuffix (click)="save()">save</mat-icon>
        
        </mat-form-field>
      </div>

        <div *ngFor="let item of todoList(); let i = index" class="listing">
          <div>
            <mat-checkbox (click)="checkmarkChanged(i)" [disabled]="selectedIndex>=0">
              <span [ngClass]="item.done ? 'crossover' : ''">{{item.descripcion}}</span>
            </mat-checkbox>
          </div>
      
           <div *ngIf="selectedIndex < 0">
              <mat-icon *ngIf="!item.done" matSuffix (click)="editItem(i, item)">edit</mat-icon>&nbsp;
              <mat-icon matSuffix (click)="deleteConfirmation(i)">delete</mat-icon>
           </div>

        </div>

        <div *ngIf="todoList().length === 0" class="error-container">
        <p>Sin tareas</p>
      </div>
      
    </mat-card-content>
  </mat-card>
</div>
